<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Master</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dfeeff);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: min(90%, 620px);
            padding: 32px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #1e3a8a;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1f2937;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 18px;
        }
        button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AI Quiz Master</h1>
        <form method="POST">
            <label for="topic">Quiz Topic</label>
            <input id="topic" name="topic" type="text" placeholder="e.g. national flags, planets, world capitals" />
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <button type="submit">Start Quiz</button>
        </form>
    </div>
</body>
</html>
